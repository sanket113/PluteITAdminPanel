<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Categories</title>
    <link rel="stylesheet" href="../css/style.css" />
    <style>
      /* Dropdown Styling */
      select {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        font-size: 16px;
        border: 2px solid #ccc;
        border-radius: 5px;
        background-color: #fff;
        cursor: pointer;
        transition: border-color 0.3s ease;
      }

      /* Hover effect */
      select:hover {
        border-color: #007bff;
      }

      /* Focus effect */
      select:focus {
        outline: none;
        border-color: #0056b3;
        box-shadow: 0 0 5px rgba(0, 91, 187, 0.5);
      }

      /* Dropdown options */
      select option {
        padding: 10px;
        font-size: 16px;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div class="dashboard-container">
      <!-- Sidebar Placeholder -->
      <div id="sidebar-container">
      </div>

      <!-- Main Content -->
      <div class="main-content">
        <div id="category-grid" class="grid-container"></div>

        <!-- Floating Add Button -->
        <button id="add-category-btn" class="floating-btn">+</button>
      </div>
    </div>

    <!-- Modal Dialog -->
    <div id="add-category-modal" class="modal hidden">
      <div class="modal-content">
        <span id="close-modal" class="close-btn">&times;</span>
        <h2>Add New Category</h2>
        <form id="add-category-form">
          <input
            type="text"
            id="categories-title"
            placeholder="Category Title"
            required
          />
          <input
            type="text"
            id="category-subtitle"
            placeholder="Category Subtitle"
            required
          />
          <input type="file" id="category-image-file" accept="image/*" required />


          <label for="category-type">UI Type:</label>
          <select id="category-type" required>
            <option value="LIST">LIST</option>
            <option value="GRID">GRID</option>
            <option value="POST">POST</option>
          </select>

          <button type="submit">Add Category</button>
        </form>
      </div>
    </div>
    <!-- Edit Category Modal -->
<div id="edit-category-modal" class="modal hidden">
  <div class="modal-content">
    <span id="close-edit-modal" class="close-btn">&times;</span>
    <h2>Edit Category</h2>
    <form id="edit-category-form">
      <label for="edit-category-title">Title:</label>
      <input type="text" id="edit-category-title" required />

      <label for="edit-category-subtitle">Subtitle:</label>
      <input type="text" id="edit-category-subtitle" required />

      <!-- Display Current Image -->
      <img id="current-category-image" src="" alt="Current Image" style="max-width: 100px; margin-bottom: 10px;" />

      <label for="edit-category-image">Upload New Image:</label>
      <input type="file" id="edit-category-image" accept="image/*" />

      <label for="edit-category-type">Category Type:</label>
      <select id="edit-category-type" required>
        <option value="LIST">LIST</option>
        <option value="GRID">GRID</option>
        <option value="POST">POST</option>
      </select>

      <button type="submit">Save Changes</button>
    </form>
  </div>
</div>


    <script type="module" src="../js/sidebar.js"></script>
    <script type="module" src="../js/add-category.js"></script>
    <div id="loading-overlay" class="hidden">
      <div class="loader"></div>
      <div class="loader-text">Please wait...</div>
    </div>
  </body>
</html>
